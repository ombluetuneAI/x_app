<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>X Profile Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <button id="backBtn" class="back-btn hidden">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z" fill="currentColor"></path>
                </svg>
            </button>
            <div class="header-content">
                <div class="header-title" id="headerTitle">Home</div>
                <div class="header-subtitle" id="headerSubtitle"></div>
            </div>
            <button class="settings-btn" onclick="openSettings()" title="设置">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 1c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-9c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-9c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" opacity="0"/><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"></path></svg>
            </button>
        </header>

        <!-- Home View -->
        <div id="homeView" class="view">
            <div class="home-tabs" id="homeTabs">
                <button class="home-tab active-home-tab" data-feed="foryou">推荐</button>
                <button class="home-tab" data-feed="following">关注</button>
            </div>
            <div id="homeFeed" class="home-feed">
                <div class="loading">Loading...</div>
            </div>
            <div id="loadMoreHome" class="scroll-sentinel"></div>
        </div>

        <!-- Profile View -->
        <div id="profileView" class="view hidden">
            <!-- Banner -->
            <div class="banner-container">
                <div id="banner" class="banner"></div>
            </div>

            <!-- Profile Info -->
            <div class="profile-info">
                <div class="avatar-container">
                    <img id="avatar" class="avatar" src="" alt="Avatar">
                </div>
                
                <div class="profile-actions">
                    <button id="followBtn" class="follow-btn">Follow</button>
                </div>

                <div class="profile-name">
                    <h1 id="userName"></h1>
                    <span id="verifiedBadge" class="verified-badge hidden">
                        <svg viewBox="0 0 22 22" width="20" height="20">
                            <path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z" fill="#1d9bf0"></path>
                        </svg>
                    </span>
                </div>

                <div class="profile-handle">
                    <span id="screenName"></span>
                </div>

                <div class="profile-bio" id="bio"></div>

                <div class="profile-meta" id="meta">
                    <span class="meta-item location" id="location"></span>
                    <span class="meta-item joined" id="joined"></span>
                </div>

                <div class="profile-stats">
                    <a href="#" id="followingLink" class="stat-item">
                        <span class="stat-value" id="followingCount">0</span>
                        <span class="stat-label">Following</span>
                    </a>
                    <span class="stat-item">
                        <span class="stat-value" id="followersCount">0</span>
                        <span class="stat-label">Followers</span>
                    </span>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs" id="tabs">
                <button class="tab" data-tab="posts">Posts</button>
                <button class="tab" data-tab="replies">Replies</button>
                <button class="tab" data-tab="highlights">Highlights</button>
                <button class="tab active-tab" data-tab="media">Media</button>
            </div>

            <!-- Content Container -->
            <div id="contentContainer">
                <!-- Posts View -->
                <div id="postsView" class="content-view hidden">
                    <div id="tweetsList" class="tweets-list">
                        <div class="loading">Loading posts...</div>
                    </div>
                    <div id="loadMorePosts" class="scroll-sentinel"></div>
                </div>

                <!-- Media Grid -->
                <div id="mediaView" class="content-view">
                    <div id="mediaGrid" class="media-grid">
                        <div class="loading">Loading media...</div>
                    </div>
                    <div id="loadMoreMedia" class="scroll-sentinel"></div>
                </div>

                <!-- Replies View (placeholder) -->
                <div id="repliesView" class="content-view hidden">
                    <div class="loading">Replies feature coming soon...</div>
                </div>

                <!-- Highlights View (placeholder) -->
                <div id="highlightsView" class="content-view hidden">
                    <div class="loading">Highlights feature coming soon...</div>
                </div>
            </div>
        </div>

        <!-- Following View -->
        <div id="followingView" class="view hidden">
            <div class="following-header">
                <span id="followingTitle"></span>
            </div>
            <div id="followingList" class="following-list">
                <div class="loading">Loading following...</div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="settings-modal hidden">
        <div class="settings-overlay" onclick="closeSettings()"></div>
        <div class="settings-panel">
            <div class="settings-header">
                <h2>设置</h2>
                <button class="settings-close" onclick="closeSettings()">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M13.414 12l5.793-5.793c.39-.39.39-1.023 0-1.414s-1.023-.39-1.414 0L12 10.586 6.207 4.793c-.39-.39-1.023-.39-1.414 0s-.39 1.023 0 1.414L10.586 12l-5.793 5.793c-.39.39-.39 1.023 0 1.414.195.195.45.293.707.293s.512-.098.707-.293L12 13.414l5.793 5.793c.195.195.45.293.707.293s.512-.098.707-.293c.39-.39.39-1.023 0-1.414L13.414 12z"></path></svg>
                </button>
            </div>
            <div class="settings-body">
                <!-- Image Proxy Section -->
                <div class="settings-section">
                    <div class="settings-section-header">
                        <h3>图片代理</h3>
                        <label class="toggle-switch">
                            <input type="checkbox" id="imageProxyEnabled" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <p class="settings-desc">通过代理加载图片，关闭后直连原图</p>
                    <div class="settings-field">
                        <label>选择代理</label>
                        <div id="imageProxyList" class="proxy-list"></div>
                    </div>
                    <div class="settings-field">
                        <label>添加代理</label>
                        <div class="proxy-add-row">
                            <input type="text" id="newImageProxy" placeholder="https://example.com?url=" autocomplete="off">
                            <button class="proxy-add-btn" onclick="addImageProxy()">添加</button>
                        </div>
                    </div>
                </div>

                <!-- Video Proxy Section -->
                <div class="settings-section">
                    <div class="settings-section-header">
                        <h3>视频代理</h3>
                        <label class="toggle-switch">
                            <input type="checkbox" id="videoProxyEnabled">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <p class="settings-desc">通过代理加载视频，默认关闭直连播放</p>
                    <div class="settings-field">
                        <label>选择代理</label>
                        <div id="videoProxyList" class="proxy-list"></div>
                    </div>
                    <div class="settings-field">
                        <label>添加代理</label>
                        <div class="proxy-add-row">
                            <input type="text" id="newVideoProxy" placeholder="https://example.com?url=" autocomplete="off">
                            <button class="proxy-add-btn" onclick="addVideoProxy()">添加</button>
                        </div>
                    </div>
                </div>

                <div class="settings-divider"></div>

                <!-- Translation API Section -->
                <div class="settings-section">
                    <h3>小牛翻译 API</h3>
                    <p class="settings-desc">用于推文翻译功能，密钥仅保存在本地浏览器中</p>
                    <div class="settings-field">
                        <label for="niutransAppId">App ID</label>
                        <input type="text" id="niutransAppId" placeholder="请输入小牛翻译 App ID" autocomplete="off">
                    </div>
                    <div class="settings-field">
                        <label for="niutransApiKey">API Key</label>
                        <input type="password" id="niutransApiKey" placeholder="请输入小牛翻译 API Key" autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="settings-footer">
                <button class="settings-save" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/umd/photoswipe.umd.min.js"></script>
    <script src="translate.js"></script>
    <script src="app.js"></script>
</body>
</html>
